<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WingPoint — Wingspan scorekeeper</title>
    <meta
      name="description"
      content="Keep score and track stats for Wingspan and its expansions. Works offline."
    />
    <meta name="theme-color" content="#2f6b45" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WingPoint" />
  </head>
  <body>
    <div id="root">
      <div
        id="wp-boot"
        style="min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; text-align: center; font-family: system-ui, sans-serif; color: #7f7162"
      >
        <div>
          <div style="font-size: 2.5rem">🪽</div>
          <p>Loading WingPoint…</p>
          <p id="wp-boot-msg" style="color: #a3332f; white-space: pre-wrap; max-width: 34rem"></p>
        </div>
      </div>
    </div>
    <script>
      // If the app fails to boot, show the reason instead of a blank page.
      (function () {
        var message = document.getElementById('wp-boot-msg');
        function show(text) {
          if (message && !message.textContent) message.textContent = text;
        }
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') show('Failed to load ' + (target.src || 'script'));
            else show(event.message || 'Unknown error');
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          show((event.reason && event.reason.message) || String(event.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
